name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Typecheck Backend
        run: npm run build --prefix backend

      - name: Typecheck Frontend
        run: npm run typecheck --prefix frontend

      - name: Lint Frontend (oxlint)
        run: npm run lint --prefix frontend

      - name: Run Frontend Tests
        run: npm test --prefix frontend -- --run

      - name: Run Backend Tests
        run: npm test --prefix backend
        env:
          NODE_ENV: test
          ADMIN_PASSWORD: test-admin-passphrase-secure-123
          ADMIN_TOKEN_SECRET: test-token-secret-for-integration-tests-123

      - name: Build Frontend
        run: npm run build --prefix frontend
        env:
          VITE_API_URL: https://portfolio-backend-st78.onrender.com
          VITE_SITE_URL: https://amoo-quadri.vercel.app

      - name: Build Backend
        run: npm run build --prefix backend
